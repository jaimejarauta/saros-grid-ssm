[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "saros-grid-ssm"
version = "0.1.0"
description = "Spatio-Temporal Selective State Space Model for Spanish REE Electricity Grid Dispatch"
readme = "START_CODING.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
sdwpf = [
    "pandas>=2.0",
    "lightgbm>=4.0",
    "huggingface_hub>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]
