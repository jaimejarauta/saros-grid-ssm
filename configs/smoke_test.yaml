# Saros Grid SSM Smoke Test Configuration
question: "Can spatio-temporal selective state space models predict 15-minute nodal renewable injection and curtailment with wMAPE < 6.5%?"
date: "2026-10-25"

grid:
  num_nodes: 50
  timesteps: 96           # 24 hours @ 15-minute dispatch intervals
  in_features: 4          # solar_mw, wind_mw, demand_mw, net_export_capacity
  out_features: 2         # predicted solar_mw, wind_mw
  curtailment_out: 1      # binary bottleneck indicator

model:
  d_model: 64
  d_state: 16             # SSM latent state dimension
  num_spatial_hops: 2     # K-hop graph diffusion
  num_layers: 2
  bidirectional: true
  dropout: 0.05

training:
  lr: 0.005
  weight_decay: 0.0001
  steps: 300
  batch_size: 16
  s_base_mw: 1000.0
  curt_loss_weight: 0.10
  seed: 2026

pre_registered_rules:
  gate_metric: "wmape"
  gate_threshold: 0.065   # Target: wMAPE < 6.5%
  curtailment_f1_threshold: 0.75
  kill_rule: "wmape >= 0.085 or f1 < 0.50"
  pass_rule: "wmape < 0.065 and f1 >= 0.75"
  max_runtime_sec: 180
